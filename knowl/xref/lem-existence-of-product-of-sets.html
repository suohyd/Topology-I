<div class="para">A product of sets <span class="process-math">\(X_\alpha\)</span> is the Cartesian product of sets, i.e.,</div>
<div class="displaymath process-math">

\prod X_\alpha=\lbrace(x_\alpha)_{\alpha\in I}:x_\alpha\in X_\alpha\rbrace.
\end{equation*}
