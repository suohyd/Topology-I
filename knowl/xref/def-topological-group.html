</h3>
<div xmlns:xlink="http://www.w3.org/1999/xlink" class="para">Let <span class="process-math">\(G\)</span> be a group and a topological space. We say that <span class="process-math">\(G\)</span> is a <em class="emphasis">topological group</em> if the group operation <span class="process-math">\(G\times G\to G\text{,}\)</span> given by <span class="process-math">\((g,h)\mapsto gh\)</span> and the inverse map <span class="process-math">\(G\to G\)</span> given by <span class="process-math">\(g\mapsto g^{-1}\)</span> are continous.</div></article><span class="incontext"><a class="internal" href="sec-topological-groups.html#def-topological-group">in-context</a></span>
